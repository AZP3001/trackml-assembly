name: Tests

# Every branch. Gating these on "main" meant that for the whole life of this
# repo — whose default branch is not main — the test suite never ran once.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — versioncheck.mjs below walks full git history
      # (git rev-list --count from the WebAssembly-port commit), which a
      # shallow checkout can't see.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned. The committed wasm has to rebuild byte-for-byte, and a runner
      # image that quietly moves to a new clang changes codegen — which would
      # surface as an unexplained binary diff rather than as "the compiler
      # changed". Bump this deliberately and recommit the wasm when you do.
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/wasm-ld wasm-ld /usr/bin/wasm-ld-18 100
          clang --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The committed .wasm files ARE the backend — Pages serves this repo as
      # is and nothing compiles them at deploy time — so they have to be the
      # ones sim.c produces. Same contract as the stylesheet below: rebuild,
      # and fail if the bytes drift.
      - name: Build both wasm variants, and check the committed ones match
        run: |
          cp wasm/sim.wasm /tmp/committed-sim.wasm
          cp wasm/sim-simd.wasm /tmp/committed-sim-simd.wasm
          ./wasm/build.sh
          diff -q /tmp/committed-sim.wasm wasm/sim.wasm \
            || { echo '::error::wasm/sim.wasm is stale — run ./wasm/build.sh and commit the result'; exit 1; }
          diff -q /tmp/committed-sim-simd.wasm wasm/sim-simd.wasm \
            || { echo '::error::wasm/sim-simd.wasm is stale — run ./wasm/build.sh and commit the result'; exit 1; }

      # external/tailwind.css is generated from the classes used in the markup
      # and committed, because Pages serves this repo as-is. Same contract the
      # wasm has: rebuild it and fail if the committed bytes drift.
      - name: Stylesheet matches the markup
        run: |
          cp external/tailwind.css /tmp/committed.css
          ./tools/build-css.sh
          diff -q /tmp/committed.css external/tailwind.css \
            || { echo '::error::external/tailwind.css is stale — run ./tools/build-css.sh and commit the result'; exit 1; }

      # There is no libm in a freestanding wasm build, so sin/cos/atan2/tanh/
      # acos/exp are hand-written in sim.c. A wrong polynomial coefficient there
      # doesn't throw — it just makes cars steer slightly wrong. Both variants
      # get checked because -msimd128 changes codegen throughout.
      - name: Math self-test
        run: |
          node tools/mathtest.mjs wasm/sim.wasm
          node tools/mathtest.mjs wasm/sim-simd.wasm

      # The auto-width solver: does a pinched track narrow, does a normal one
      # stay untouched, and does a self-crossing one survive.
      - name: Auto-width behaviour
        run: |
          node tools/autowidth.mjs wasm/sim.wasm
          node tools/autowidth.mjs wasm/sim-simd.wasm

      # Cars stay on the track, and evolution selects the fast ones. Runs
      # generations to completion rather than to a frame budget — a crawling
      # car needs tens of thousands of frames to finish a lap, so a capped
      # harness cannot see the pace problem at all.
      # Gate placement: every corner anchors one, spacing stays sane, and the
      # rectangle case guards the acos(-0) regression that used to delete a
      # corner from every right-angled track.
      - name: Checkpoint placement
        run: |
          node tools/checkpoints.mjs wasm/sim.wasm
          node tools/checkpoints.mjs wasm/sim-simd.wasm

      - name: Race behaviour
        run: node tools/racepace.mjs wasm/sim.wasm

      # A stopped car can't pivot, braking scales with how hard the AI presses
      # it instead of snapping speed down by the same flat amount regardless,
      # and turning authority is grip-limited (full at low speed, falling off
      # near maxSpeed) rather than the old curve that turned WORST at a
      # standstill and BEST flat out.
      - name: Car physics (braking, turning, grip)
        run: |
          node tools/carphysics.mjs wasm/sim.wasm
          node tools/carphysics.mjs wasm/sim-simd.wasm

      # Mutation sigma follows sigmaGen against the exp(-sigmaGen/TAU) curve
      # in sim.c, evolve()'s focus window aims at crash_count (where the
      # population is dying) below FEW_LAPS_THRESHOLD completed-lap
      # generations and at gate_ratio (the slowest reached gate) at or above
      # it, and the per-frame progress reward is flat rather than
      # speed-proportional — a car that brakes partway through the window
      # scores exactly the same as one that never lifts.
      - name: Evolution tuning (mutation settle, focus targeting, braking)
        run: |
          node tools/mutationsettle.mjs wasm/sim.wasm
          node tools/mutationsettle.mjs wasm/sim-simd.wasm

      # The worker pool can change shape mid-generation (the cores slider, the
      # CPU/GPU toggle): every car is packed out of one wasm instance and
      # unpacked into another. Byte-identical continuation or it's a bug.
      - name: State migration
        run: |
          node tools/statemigrate.mjs wasm/sim.wasm
          node tools/statemigrate.mjs wasm/sim-simd.wasm

      # The sidebar version number ("V21.9 · build ...") is computed from git
      # history in deploy.yml, never typed by hand — this proves the formula
      # is sound and stays monotonic walking the branch forward.
      - name: Version scheme
        run: node tools/versioncheck.mjs

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Loads the real page in a real browser: module compiles, worker pool
      # comes up, tracks generate, cars drive, generations advance, editor edits.
      # Includes a second pass in a phone-shaped browser context: the lighter
      # defaults, the capped worker pool and the smaller raster are things you
      # only find out are wrong on a device, so they get checked here instead.
      - name: End-to-end
        run: |
          npx --yes http-server -p 8765 --silent . &
          npx --yes wait-on -t 30000 http://127.0.0.1:8765/index.html
          node tools/e2e.mjs http://127.0.0.1:8765

      # The WebGPU backend is a second implementation of the step, in WGSL.
      # Runs a CPU worker and a GPU worker side by side on SwiftShader's
      # software adapter and holds them to the same race; skips cleanly if
      # the runner's browser exposes no WebGPU adapter at all.
      - name: GPU / CPU parity
        run: node tools/gpuparity.mjs http://127.0.0.1:8765

      - name: Benchmark (informational)
        run: |
          node tools/bench.mjs
          WASM=wasm/sim-simd.wasm node tools/bench.mjs
