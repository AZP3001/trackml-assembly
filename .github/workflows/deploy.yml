name: Deploy Static Content

# Runs on a push to ANY branch, and then decides for itself whether that branch
# is the one Pages will accept.
#
# The `github-pages` environment only accepts a deployment from the repository's
# DEFAULT branch. A run from any other branch is rejected by the environment
# before a single step executes, which shows up as a failed job with no logs and
# no explanation — that is what made this look like "the workflows don't work".
#
# So rather than hard-coding a branch name that can drift out of step with the
# repository setting, every job below is gated on
# `github.event.repository.default_branch`, which GitHub fills in at run time.
# Change the default branch in Settings and this keeps working with no edit
# here; push to a branch that isn't the default and you get a plain explanation
# in the run summary instead of a red X.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a queued run supersedes an older one rather than
# racing it to the same environment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site is served straight out of the repository, so the committed
  # wasm/*.wasm ARE the backend. This job rebuilds them from wasm/sim.c and
  # fails if the result differs from what's checked in — the committed binaries
  # can never quietly drift from their source.
  verify-wasm:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Record committed checksums
        run: sha256sum wasm/sim.wasm wasm/sim-simd.wasm | tee committed.sha256

      - name: Rebuild from source
        run: ./wasm/build.sh

      - name: Compare against committed binaries
        run: |
          if ! sha256sum -c committed.sha256; then
            echo "::error file=wasm/sim.c::wasm/sim.c does not match the committed .wasm files. Run ./wasm/build.sh and commit the result."
            exit 1
          fi

  deploy:
    needs: verify-wasm
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A build stamp, so "did my push actually go live?" has an answer you can
      # read off the page and that CI can verify below. It is generated here
      # rather than committed, so it can never be stale or cause a merge
      # conflict. The sidebar reads it; if it is missing (running locally) the
      # page just shows its static version instead.
      - name: Stamp the build
        run: |
          cat > version.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "short": "${GITHUB_SHA:0:7}",
            "ref": "${GITHUB_REF_NAME}",
            "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run": "${GITHUB_RUN_ID}"
          }
          JSON
          cat version.json

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A deploy that reports success while the CDN keeps serving the previous build
  # is the failure mode that actually bit this project: the site sat on a
  # 21-hour-old commit while everything upstream looked green. So don't take the
  # deploy step's word for it — ask the live site which commit it is serving.
  verify-live:
    needs: deploy
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the live site is serving this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -u
          url="${PAGE_URL%/}/version.json"
          echo "Polling $url for ${GITHUB_SHA}"
          for attempt in $(seq 1 20); do
            live=$(curl -fsS -H 'Cache-Control: no-cache' "$url" 2>/dev/null \
                   | tr -d ' \n' | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p') || true
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "live site is serving ${GITHUB_SHA:0:7} after ${attempt} attempt(s)"
              {
                echo "### Deployed"
                echo ""
                echo "\`${GITHUB_SHA:0:7}\` is live at ${PAGE_URL}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}: serving '${live:-nothing}', waiting..."
            sleep 15
          done
          echo "::error::Pages reported a successful deploy but ${PAGE_URL} is still serving '${live:-nothing}' instead of ${GITHUB_SHA}."
          exit 1

  # Pushed to a branch Pages will not accept. Say so clearly instead of leaving
  # a mysterious failure or, worse, nothing at all.
  not-deployed:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Explain why nothing was published
        run: |
          {
            echo "### Not published"
            echo ""
            echo "This run was for \`${GITHUB_REF_NAME}\`, but GitHub Pages only accepts"
            echo "a deployment from the repository's default branch, which is currently"
            echo "\`${{ github.event.repository.default_branch }}\`."
            echo ""
            echo "Either push to \`${{ github.event.repository.default_branch }}\`, or change the default branch"
            echo "under **Settings → General → Default branch**. This workflow reads the"
            echo "setting at run time, so it needs no edit either way."
          } >> "$GITHUB_STEP_SUMMARY"
