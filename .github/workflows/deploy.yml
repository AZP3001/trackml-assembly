name: Deploy Static Content

# Runs on a push to ANY branch, and then decides for itself whether that branch
# is the one Pages will accept.
#
# The `github-pages` environment only accepts a deployment from the repository's
# DEFAULT branch. A run from any other branch is rejected by the environment
# before a single step executes, which shows up as a failed job with no logs and
# no explanation — that is what made this look like "the workflows don't work".
#
# So rather than hard-coding a branch name that can drift out of step with the
# repository setting, every job below is gated on
# `github.event.repository.default_branch`, which GitHub fills in at run time.
# Change the default branch in Settings and this keeps working with no edit
# here; push to a branch that isn't the default and you get a plain explanation
# in the run summary instead of a red X.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The site is served straight out of the repository, so the committed
  # wasm/*.wasm ARE the backend. This job rebuilds them from wasm/sim.c and
  # fails if the result differs from what's checked in — the committed binaries
  # can never quietly drift from their source.
  verify-wasm:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Record committed checksums
        run: sha256sum wasm/sim.wasm wasm/sim-simd.wasm | tee committed.sha256

      - name: Rebuild from source
        run: ./wasm/build.sh

      - name: Compare against committed binaries
        run: |
          if ! sha256sum -c committed.sha256; then
            echo "::error file=wasm/sim.c::wasm/sim.c does not match the committed .wasm files. Run ./wasm/build.sh and commit the result."
            exit 1
          fi

  deploy:
    needs: verify-wasm
    if: github.ref_name == github.event.repository.default_branch
    # Scoped to this job, NOT to the whole workflow.
    #
    # At workflow level the group is joined by every run, including one from a
    # branch that only prints an explanation and publishes nothing — and with
    # cancel-in-progress that run happily cancels the real deploy it raced. Two
    # branches pushed together is enough to leave the site un-updated while both
    # runs look accounted for. Only jobs that actually publish belong in the
    # queue.
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # fetch-depth: 0, not the default shallow clone — the version number
      # below is a commit count, and `git rev-list` on a depth-1 checkout sees
      # only one commit and gets it wrong.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version number, computed from git history rather than typed by
      # hand anywhere.
      #
      # The predecessor project (AZP3001/main) hand-maintained a "TrackML
      # V14.0" style string in index.html, bumped it by editing that string on
      # whatever commit seemed to deserve it, and repeatedly forgot to: see
      # its own history for "Fixxed Version number" and "Fixxed Version
      # number forgotten from last update" as separate commits after the
      # feature that should have carried the bump. A number a human has to
      # remember to update is a number that eventually lies.
      #
      # So this one can't be forgotten because nobody sets it: PORT_COMMIT is
      # the commit that ported the project to WebAssembly — the first commit
      # of this repository, and a new major line the same way V14→V20 in
      # main's history each marked a step change, so it is V21.0. Every commit
      # reachable from HEAD after it adds one to the minor number, counted
      # fresh on every deploy. There is nothing to edit, so there is nothing
      # to forget.
      - name: Compute version
        id: version
        env:
          PORT_COMMIT: ebf75a7deee71bd16b81ff5336ad054f9243c509
        run: |
          if ! git merge-base --is-ancestor "$PORT_COMMIT" HEAD; then
            echo "::error::PORT_COMMIT ($PORT_COMMIT) is not an ancestor of HEAD — the version baseline in deploy.yml needs updating."
            exit 1
          fi
          since=$(git rev-list --count "${PORT_COMMIT}..HEAD")
          version="21.${since}"
          echo "version=${version}" | tee -a "$GITHUB_OUTPUT"

      # A build stamp, so "did my push actually go live?" has an answer you can
      # read off the page and that CI can verify below. It is generated here
      # rather than committed, so it can never be stale or cause a merge
      # conflict. The sidebar reads it; if it is missing (running locally) the
      # page just shows its static version instead.
      - name: Stamp the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > version.json <<JSON
          {
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "short": "${GITHUB_SHA:0:7}",
            "ref": "${GITHUB_REF_NAME}",
            "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run": "${GITHUB_RUN_ID}"
          }
          JSON
          cat version.json

      # Point every asset URL at this build. index.html itself is served
      # no-store, so it is always current; everything it references can then be
      # cached hard, because a new deploy gives it a new URL. Without this the
      # page had to refuse caching on everything, and paid the full download
      # and wasm compile on every single visit.
      - name: Stamp asset URLs with the build version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/?v=dev/?v=${VERSION}/g; s/<meta name=\"asset-version\" content=\"dev\">/<meta name=\"asset-version\" content=\"${VERSION}\">/" index.html
          grep -c "?v=${VERSION}" index.html
          grep "asset-version" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A deploy that reports success while the CDN keeps serving the previous build
  # is the failure mode that actually bit this project: the site sat on a
  # 21-hour-old commit while everything upstream looked green. So don't take the
  # deploy step's word for it — ask the live site which commit it is serving.
  verify-live:
    needs: deploy
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the live site is serving this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -u
          url="${PAGE_URL%/}/version.json"
          echo "Polling $url for ${GITHUB_SHA}"
          # Backs off instead of hammering a fixed 15s: a deploy that lands
          # quickly is confirmed in a couple of seconds, and one that never
          # lands stops burning five minutes of CI to say so.
          delay=2
          for attempt in $(seq 1 12); do
            live=$(curl -fsS -H 'Cache-Control: no-cache' "$url" 2>/dev/null \
                   | tr -d ' \n' | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p') || true
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "live site is serving V${VERSION} (${GITHUB_SHA:0:7}) after ${attempt} attempt(s)"
              {
                echo "### Deployed"
                echo ""
                echo "**V${VERSION}** — \`${GITHUB_SHA:0:7}\` is live at ${PAGE_URL}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}: serving '${live:-nothing}', waiting ${delay}s..."
            sleep "$delay"
            delay=$(( delay < 30 ? delay * 2 : 30 ))
          done
          echo "::error::Pages reported a successful deploy but ${PAGE_URL} is still serving '${live:-nothing}' instead of ${GITHUB_SHA}."
          exit 1

  # Pushed to a branch Pages will not accept. Say so clearly instead of leaving
  # a mysterious failure or, worse, nothing at all.
  not-deployed:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Explain why nothing was published
        run: |
          {
            echo "### Not published"
            echo ""
            echo "This run was for \`${GITHUB_REF_NAME}\`, but GitHub Pages only accepts"
            echo "a deployment from the repository's default branch, which is currently"
            echo "\`${{ github.event.repository.default_branch }}\`."
            echo ""
            echo "Either push to \`${{ github.event.repository.default_branch }}\`, or change the default branch"
            echo "under **Settings → General → Default branch**. This workflow reads the"
            echo "setting at run time, so it needs no edit either way."
          } >> "$GITHUB_STEP_SUMMARY"
